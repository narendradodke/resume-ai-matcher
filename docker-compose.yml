services:
  postgres:
    image: postgres:16-alpine
    container_name: resume_matcher_postgres
    restart: always
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:?ERROR: POSTGRES_PASSWORD must be set in .env}"
      POSTGRES_DB: ${POSTGRES_DB:-resume_matcher}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-user} -d $${POSTGRES_DB:-resume_matcher}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: resume_matcher_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume_matcher_backend
    restart: always
    ports:
      - "8000:8000"
    env_file:
      - path: .env
        required: false
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - "DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:?ERROR: POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-resume_matcher}}"
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - "JWT_SECRET_KEY=${JWT_SECRET_KEY:?ERROR: JWT_SECRET_KEY must be set in .env}"
      - JWT_ALGORITHM=${JWT_ALGORITHM:-HS256}
      - AI_PROVIDER=${AI_PROVIDER:-anthropic}
      - AI_PROVIDER_API_KEY=${AI_PROVIDER_API_KEY:-}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads

  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: resume_matcher_celery
    restart: always
    command: ["celery", "-A", "app.core.celery_worker.celery_app", "worker", "--loglevel=info"]
    env_file:
      - path: .env
        required: false
    environment:
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - "DATABASE_URL=${DATABASE_URL:-postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:?ERROR: POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-resume_matcher}}"
      - REDIS_URL=${REDIS_URL:-redis://redis:6379/0}
      - "JWT_SECRET_KEY=${JWT_SECRET_KEY:?ERROR: JWT_SECRET_KEY must be set in .env}"
      - AI_PROVIDER=${AI_PROVIDER:-anthropic}
      - AI_PROVIDER_API_KEY=${AI_PROVIDER_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    container_name: resume_matcher_frontend
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - NEXT_PUBLIC_API_BASE_URL=${NEXT_PUBLIC_API_BASE_URL:-http://localhost:8000/api/v1}
    depends_on:
      - backend

volumes:
  postgres_data:
  redis_data:
  backend_uploads:
