services:
  - type: web
    name: resume-matcher-backend
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn backend.app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: DATABASE_URL
        fromDatabase:
          name: resume-matcher-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: resume-matcher-redis
          property: connectionString
      - key: JWT_SECRET_KEY
        generateValue: true
      - key: JWT_ALGORITHM
        value: HS256
      - key: AI_PROVIDER
        value: anthropic
      - key: AI_PROVIDER_API_KEY
        sync: false

  - type: redis
    name: resume-matcher-redis
    ipAllowList: []
    plan: free
    maxmemoryPolicy: allkeys-lru

databases:
  - name: resume-matcher-db
    databaseName: resume_matcher
    user: resume_user
    plan: free
